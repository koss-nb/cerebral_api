name: cerebral_flutter_api
description: Package Flutter pour l'intégration avec l'API CEREBRAL
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP et API
  http: ^1.1.0
  dio: ^5.3.2
  
  # Gestion d'état
  provider: ^6.1.1
  riverpod: ^2.4.9
  
  # Stockage local
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilitaires
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  
  # Gestion des erreurs
  logger: ^2.0.2+1
  
  # Validation
  form_validator: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  
  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
